<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #e4e4e4;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background: #242424;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            padding: 32px;
            border: 1px solid #3a3a3a;
        }

        h2 {
            color: #e4e4e4;
            text-align: center;
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #444;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #2d2d2d;
            color: #e4e4e4;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4f8cff;
        }

        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4f8cff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background: #3a6fd8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #999;
        }

        .login-link a {
            color: #4f8cff;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .flash {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .flash.error {
            background: #2d1b1b;
            color: #ff6b6b;
            border: 1px solid #5a2e2e;
        }
    </style>
</head>
<body>

<div class="card-container">
    <h2>用户登录</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">
        <div class="form-group">
            <label>用户名</label>
            <input name="username" placeholder="请输入用户名" required>
        </div>

        <div class="form-group">
            <label>密码</label>
            <input name="password" type="password" placeholder="请输入密码" required>
        </div>

        <button type="submit">登录</button>
    </form>

    <div class="login-link">
        还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
    </div>
</div>

</body>
</html>
