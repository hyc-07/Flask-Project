<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            color: #e4e4e4;
        }

        .container {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            border: 1px solid #333;
        }

        /* 题号 */
        .question-count {
            font-size: 16px;
            color: #999;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 题目滑动容器 */
        .question-wrapper {
            overflow: hidden;
            height: 120px;
            margin: 30px 0;
            position: relative;
        }

        .question-slider {
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .question-text {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            font-size: 28px;
            text-align: center;
            color: #d4d4d4;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #currentQuestion {
            left: 0;
        }

        #nextQuestion {
            left: -100%;
        }

        .blank {
            display: inline-block;
            min-width: 120px;
            border-bottom: 3px solid #4f8cff;
            color: #4f8cff;
            font-weight: bold;
            margin: 0 8px;
            padding-bottom: 4px;
        }

        /* 选项区域 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .option-btn {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #3a3a3a;
            border-radius: 10px;
            background: #2a2a2a;
            color: #e4e4e4;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .option-btn:hover:not(.correct):not(.wrong) {
            background: #333;
            border-color: #4f8cff;
        }

        .option-btn.correct {
            border-color: #10b981 !important;
            background-color: #1b3a2d !important;
            color: #6ee7b7 !important;
        }

        .option-btn.wrong {
            border-color: #ef4444 !important;
            background-color: #2d1b1b !important;
            color: #fca5a5 !important;
        }

        /* 失败提示 */
        .fail-tip {
            text-align: center;
            font-size: 18px;
            color: #fca5a5;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #2d1b1b;
            border: 1px solid #5a2e2e;
            display: none;
        }

        .fail-tip a {
            color: #4f8cff;
            text-decoration: none;
            font-weight: bold;
        }

        .fail-tip a:hover {
            text-decoration: underline;
        }

        /* ✅ 加载动画 */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            z-index: 100;
            background: rgba(30, 30, 30, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            min-width: 200px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a2a;
            border-top: 3px solid #4f8cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ✅ 注册成功提示 */
        .success-tip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #6ee7b7;
            font-size: 18px;
            font-weight: 600;
            z-index: 100;
            background: rgba(30, 30, 30, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #1b3a2d;
            min-width: 200px;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="question-count" id="questionCount">填空题：1/8题</div>

        <div class="question-wrapper">
            <div class="question-slider" id="questionSlider">
                <div class="question-text" id="currentQuestion"></div>
                <div class="question-text" id="nextQuestion"></div>
            </div>
        </div>

        <div class="options-container" id="optionsContainer"></div>
        <div class="fail-tip" id="failTip">✗ 验证失败，<a href="/register">返回注册</a></div>

        <div class="loading-indicator" id="loadingIndicator">
            <div class="loading-spinner"></div>
            <span>正在注册，请稍候...</span>
        </div>

        <div class="success-tip" id="successTip">
            <div class="success-icon">✓</div>
            <span>注册成功！</span>
        </div>
    </div>

    <script>
        const wordList = [
            "数量正在研发", "酸碱盐在远方", "我们气氛活跃", "显然很吸引人",
            "会议通知之日", "显然很直接", "会员充值信仰", "中考完才恍然",
            "刘耀文连体裤", "列车员在国外", "薄荷在雪原", "评价最高的",
            "爷爷要打张健", "来反馈周刊网"
        ];

        const fiveCharWords = {
            "显然很直接": { part1: "显然很", part2: "直接" },
            "薄荷在雪原": { part1: "薄荷", part2: "在雪原" },
            "评价最高的": { part1: "评价最", part2: "高的" }
        };

        const equivalentOptions = {
            "在研发": "在远方",
            "在远方": "在研发"
        };

        let currentQuestionIndex = 0;
        let questions = [];
        let isAnswered = false;

        const questionCountEl = document.getElementById("questionCount");
        const questionSlider = document.getElementById("questionSlider");
        const currentQuestionEl = document.getElementById("currentQuestion");
        const nextQuestionEl = document.getElementById("nextQuestion");
        const optionsContainer = document.getElementById("optionsContainer");
        const failTip = document.getElementById("failTip");
        const loadingIndicator = document.getElementById("loadingIndicator");
        const successTip = document.getElementById("successTip");

        function init() {
            generateAllQuestions();
            showQuestion(0);
        }

        function generateAllQuestions() {
            questions = [];

            const sixCharWords = wordList.filter(word => !fiveCharWords[word] && word.length === 6);
            const fiveCharWordsList = Object.keys(fiveCharWords);

            let availableSixChar = [...sixCharWords];
            let availableFiveChar = [...fiveCharWordsList];

            if (availableSixChar.length + availableFiveChar.length < 8) {
                console.error("词库不足8个，无法生成不重复题目");
                return;
            }

            for (let i = 0; i < 8; i++) {
                const question = {};

                let useSixChar = Math.random() > 0.3;

                if (useSixChar && availableSixChar.length === 0) {
                    useSixChar = false;
                }

                if (!useSixChar && availableFiveChar.length === 0) {
                    useSixChar = true;
                }

                if (useSixChar) {
                    const randomIndex = Math.floor(Math.random() * availableSixChar.length);
                    question.word = availableSixChar[randomIndex];
                    availableSixChar.splice(randomIndex, 1);

                    question.type = "sixChar";
                    question.blankPosition = Math.random() > 0.5 ? "front" : "back";

                    if (question.blankPosition === "front") {
                        const shownPart = question.word.substring(0, 3);
                        question.correct = question.word.substring(3, 6);
                        question.display = `${shownPart}<span class="blank">___</span>`;
                    } else {
                        const shownPart = question.word.substring(3, 6);
                        question.correct = question.word.substring(0, 3);
                        question.display = `<span class="blank">___</span>${shownPart}`;
                    }
                } else {
                    const randomIndex = Math.floor(Math.random() * availableFiveChar.length);
                    question.word = availableFiveChar[randomIndex];
                    availableFiveChar.splice(randomIndex, 1);

                    question.type = "fiveChar";
                    const parts = fiveCharWords[question.word];
                    const blankFirstPart = Math.random() > 0.5;

                    if (blankFirstPart) {
                        question.correct = parts.part1;
                        question.display = `<span class="blank">___</span>${parts.part2}`;
                    } else {
                        question.correct = parts.part2;
                        question.display = `${parts.part1}<span class="blank">___</span>`;
                    }
                }

                question.options = generateOptionsForQuestion(question);
                questions.push(question);
            }
        }

        function generateOptionsForQuestion(question) {
            let options = [question.correct];

            while (options.length < 3) {
                let randomOption;

                if (question.type === "sixChar") {
                    const sixCharWords = wordList.filter(word => !fiveCharWords[word] && word.length === 6 && word !== question.word);
                    const randomWord = sixCharWords[Math.floor(Math.random() * sixCharWords.length)];
                    randomOption = question.blankPosition === "front" ? randomWord.substring(3, 6) : randomWord.substring(0, 3);

                    if (equivalentOptions[question.correct] === randomOption) continue;
                } else {
                    const fiveCharKeys = Object.keys(fiveCharWords).filter(word => word !== question.word);
                    const randomWord = fiveCharKeys[Math.floor(Math.random() * fiveCharKeys.length)];
                    const parts = fiveCharWords[randomWord];
                    randomOption = Math.random() > 0.5 ? parts.part1 : parts.part2;
                }

                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }

            return shuffleArray(options);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showQuestion(index) {
            if (index >= 8) {
                showCompletion();
                return;
            }

            const question = questions[index];
            questionCountEl.textContent = `填空题：${index + 1}/8题`;
            currentQuestionEl.innerHTML = question.display;

            if (index + 1 < 8) {
                nextQuestionEl.innerHTML = questions[index + 1].display;
            }

            questionSlider.style.transform = "translateX(0)";
            renderOptions(question.options);
            isAnswered = false;
            failTip.style.display = "none";
        }

        function renderOptions(options) {
            optionsContainer.innerHTML = "";

            options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                btn.dataset.value = option;

                btn.addEventListener("click", () => {
                    if (isAnswered) return;
                    checkAnswer(option, btn);
                });

                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedValue, selectedBtn) {
            isAnswered = true;
            const currentQuestion = questions[currentQuestionIndex];
            let isCorrect = selectedValue === currentQuestion.correct;

            if (!isCorrect && equivalentOptions[currentQuestion.correct] === selectedValue) {
                isCorrect = true;
            }

            selectedBtn.classList.add(isCorrect ? "correct" : "wrong");

            if (isCorrect) {
                currentQuestionIndex++;

                setTimeout(() => {
                    questionSlider.style.transform = "translateX(-100%)";
                }, 300);

                setTimeout(() => {
                    showQuestion(currentQuestionIndex);
                }, 800);
            } else {
                failTip.style.display = "block";
            }
        }

        function showCompletion() {
            loadingIndicator.style.display = "flex";

            fetch('/verify_success', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                loadingIndicator.style.display = "none";

                if (data.status === 'success') {
                    successTip.style.display = "flex";

                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    alert(data.message);
                    window.location.href = '/register';
                }
            })
            .catch(error => {
                loadingIndicator.style.display = "none";
                console.error('验证通过请求失败:', error);
                window.location.href = '/register';
            });
        }

        window.onload = init;
    </script>
</body>
</html>
