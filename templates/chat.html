<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>实时聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ✅ 卡片容器 */
        .card-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            height: calc(100vh - 230px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ✅ 侧边栏 */
        .sidebar {
            width: 240px;
            background: #f8f9fa;
            padding: 20px;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            flex-shrink: 1;
            min-width: 150px;
        }

        .sidebar-header {
            margin-bottom: 0px;
        }

        .sidebar h3 {
            color: #333;
            margin-bottom: 6px;
            font-size: 17px;
        }

        .sidebar p {
            color: #66CD66;
            font-size: 12px;
        }

        .sidebar a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
            margin-top: 10px;
        }

        .sidebar a:hover {
            color: #007bff;
        }

        /* ✅ 个人主页模态框样式 */
        .profile-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .profile-modal.active {
            display: flex;
        }

        .profile-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .profile-close-btn {
            position: absolute; top: 12px; right: 16px;
            background: none; border: none; font-size: 1.5em;
            cursor: pointer; color: #888;
        }

        .profile-close-btn:hover { color: #333; }

        .profile-header {
            display: flex; align-items: center; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 1px solid #e9ecef;
        }

        .profile-avatar {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #007bff;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4em; font-weight: bold;
            margin-right: 15px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .profile-meta h3 { margin: 0 0 4px 0; font-size: 18px; }
        .profile-meta .status-text { font-size: 12px; display: flex; align-items: center; }
        .profile-meta .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

        .profile-field { margin-bottom: 18px; }
        .profile-label { font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        .profile-value {
            font-size: 14px; padding: 8px 0; color: #333;
            border-bottom: 1px solid #e9ecef;
        }

        .profile-input {
            width: 100%; padding: 8px 10px; font-size: 14px;
            border: 1px solid #ddd; border-radius: 8px;
            outline: none; display: none;
        }

        .profile-input:focus { border-color: #007bff; }

        .profile-actions { margin-top: 20px; text-align: right; }

        .btn-edit, .btn-save {
            padding: 6px 16px; border: none; border-radius: 12px;
            cursor: pointer; font-size: 13px; margin-left: 8px;
        }

        .btn-edit { background: #e9ecef; color: #333; }
        .btn-edit:hover { background: #d3d8de; }

        .btn-save { background: #007bff; color: #fff; display: none; }
        .btn-save:hover { background: #0056b3; }

        .readonly-hint { font-size: 11px; color: #ff4d4f; margin-top: 4px; display: none; }

        /* ✅ 在线用户列表样式 */
        .online-users-section {
            flex: 1;
            margin-top: 20px;
            overflow-y: auto;
        }

        .online-users-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e9ecef;
        }

        .online-user-item {
            display: flex;
            align-items: center;
            padding: 4px 0;
            font-size: 13px;
            color: #333;
        }

        .online-status-dot {
            width: 8px;
            height: 8px;
            background: #66CD66;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .current-user {
            font-weight: bold;
            color: #007bff;
        }

        .no-users {
            color: #999;
            font-size: 12px;
            padding: 10px 0;
        }

        /* ✅ 聊天区 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-width: 0;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f1f3f5;
            position: relative;
        }

        /* ✅ 加载动画样式 */
        .loading-indicator {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            z-index: 10;
        }

        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .messages.loading {
            opacity: 0.7;
        }

        /* ✅ 消息容器：水平布局（头像+内容） */
        .message {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }

        .message.self {
            align-items: flex-end;
        }

        .message.other {
            align-items: flex-start;
        }

        /* ✅ 消息行：头像+气泡水平排列 */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 85%;
        }

        .message.self .message-row {
            flex-direction: row-reverse;
        }

        /* ✅ 聊天区头像已彻底移除（仅个人简介保留头像） */

        /* ✅ 发送者昵称 */
        .sender-name {
            font-size: 12px;
            color: #888;
            margin-bottom: 2px;
        }

        /* ✅ 开发者头衔样式 */
        .developer-badge {
            display: inline-block;
            background: linear-gradient(135deg, #8a2be2, #9370db);
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 8px;
            margin-left: 3px;
            vertical-align: middle;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
            box-shadow: 0 2px 4px rgba(138, 43, 226, 0.3);
            animation: badge-pulse 3s infinite;
        }

        @keyframes badge-pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; }
            100% { opacity: 0.9; }
        }

        .message.self .sender-name {
            display: none;
        }

        /* ✅ 气泡样式 */
        .bubble {
            max-width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.3;
            word-break: break-word;
            text-align: left;
        }

        .self .bubble {
            background: #95ec69;
            border-bottom-right-radius: 4px;
        }

        .other .bubble {
            background: white;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        /* ✅ 时间样式 */
        .time {
            font-size: 9px;
            color: #888;
            margin-top: 2px;
        }

        .self-time { text-align: right; }
        .other-time { text-align: left; }

        /* ✅ 输入区 */
        .input-area {
            display: flex;
            padding: 14px 20px;
            border-top: 1px solid #e9ecef;
            background: white;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .input-area button {
            flex-shrink: 0;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            min-width: 60px;
        }

        .input-area input:focus { border-color: #007bff; }
        .input-area button:hover { background: #0056b3; }

        /* ✅ 滚动条美化 */
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        .online-users-section::-webkit-scrollbar { width: 4px; }
        .online-users-section::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

        /* ✅ 身份标签样式 */
        .role-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .role-badge.student {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }

        .role-badge.guest {
            background: #fff7e6;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }

        @media (max-width: 600px) {
            body { padding: 24px; }
            .card-container {
                height: calc(100vh - 48px);
                border-radius: 16px;
                max-width: 100%;
                min-width: 0;
            }
            .sidebar { min-width: 120px; padding: 15px; width: auto; }
            .chat-area { min-width: 200px; }
            .input-area { padding: 10px 15px; gap: 8px; }
            .input-area input { padding: 8px 12px; font-size: 14px; min-width: 0; }
            .input-area button { padding: 8px 16px; font-size: 14px; flex-shrink: 0; min-width: 60px; }
            .message-row { max-width: 90%; }
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- ✅ 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>{{ current_user.username }}</h3>
            <p>在线</p>
        </div>

        <div class="online-users-section">
            <div class="online-users-title">在线用户 (<span id="online-count">0</span>)</div>
            <div id="online-users-list">
                <div class="no-users">暂无其他用户在线</div>
            </div>
        </div>

        <a href="{{ url_for('auth.logout') }}">退出登录</a>
    </div>

    <!-- ✅ 聊天区 -->
    <div class="chat-area">
        <div class="messages" id="messages">
            <div class="loading-indicator" id="loading-indicator">
                <div class="loading-spinner"></div>
                <span>正在加载消息...</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="msg_input" placeholder="输入消息..." autocomplete="off">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>
</div>

<!-- ✅ 个人主页模态框 -->
<div class="profile-modal" id="profile-modal">
    <div class="profile-card">
        <button class="profile-close-btn" onclick="closeProfile()">&times;</button>

        <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar"></div>
            <div class="profile-meta">
                <h3 id="profile-username"></h3>
                <div class="status-text">
                    <span class="status-dot" id="profile-status-dot"></span>
                    <span id="profile-status-text"></span>
                </div>
            </div>
        </div>

        <!-- ✅ 身份标签（显示在真实姓名左边，共占一行） -->
        <div class="profile-field">
            <div class="profile-label">身份 & 真实姓名</div>
            <div class="profile-value" id="profile-role-realname">
                <span class="role-badge" id="profile-role-badge"></span>
                <span id="profile-realname-display"></span>
            </div>
            <input class="profile-input" id="profile-realname-input" placeholder="请输入真实姓名">
        </div>

        <div class="profile-field">
            <div class="profile-label">个人简介</div>
            <div class="profile-value" id="profile-bio-display"></div>
            <input class="profile-input" id="profile-bio-input" placeholder="介绍一下自己吧">
        </div>

        <div class="profile-actions">
            <button class="btn-edit" id="btn-edit" onclick="toggleEdit()">编辑资料</button>
            <button class="btn-save" id="btn-save" onclick="saveProfile()">保存修改</button>
        </div>
    </div>
</div>

<!-- ✅ 公告模态框 -->
<div class="profile-modal" id="announcementModal">
    <div class="profile-card" style="width: 420px;">
        <div class="profile-header" style="margin-bottom: 10px; padding-bottom: 10px;">
            <h3 id="announcementTitle" style="font-size: 18px;"></h3>
        </div>
        <div id="announcementContent" style="font-size: 14px; line-height: 1.8; color: #333; max-height: 300px; overflow-y: auto;"></div>
        <div style="margin-top: 20px;">
            <div id="progressBtn" style="background: #007bff; height: 40px; border-radius: 10px; position: relative; overflow: hidden; cursor: not-allowed; opacity: 0.7;">
                <div id="progressBar" style="position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: rgba(255,255,255,0.25); transition: width 0.1s linear;"></div>
                <div style="position: absolute; width: 100%; text-align: center; line-height: 40px; color: #fff; font-size: 14px; z-index: 1;">
                    <span id="countdownText">4秒后可退出</span>
                    <span id="exitText" style="display:none;">点击退出</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    window.currentUsername = "{{ current_user.username }}";
    const socket = io();

    /**
     * ✅ 页面加载时拉取历史消息
     */
    socket.on('connect', () => {
        console.log('✅ Socket 连接成功');

        const messagesContainer = document.getElementById('messages');
        const loadingIndicator = document.getElementById('loading-indicator');

        messagesContainer.classList.add('loading');

        fetch('/history')
            .then(res => res.json())
            .then(messages => {
                if (loadingIndicator) {
                    loadingIndicator.remove();
                }
                messagesContainer.classList.remove('loading');

                messages.forEach(appendMessage);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            })
            .catch(error => {
                console.error('加载历史消息失败:', error);
                if (loadingIndicator) {
                    loadingIndicator.innerHTML = '<span>加载失败，请刷新重试</span>';
                }
                messagesContainer.classList.remove('loading');
            });
    });

    socket.on('connect_error', (err) => {
        console.error('❌ Socket 连接失败:', err);
    });

    /**
     * ✅ 接收在线用户列表
     */
    socket.on('user_list', function (data) {
        updateUserList(data.users || []);
    });

    /**
     * ✅ 获取身份中文名
     */
    function getRoleLabel(role) {
        if (role === 'student') return '911';
        if (role === 'guest') return '访客';
        return role || '';
    }

    /**
     * ✅ 获取身份对应的CSS类
     */
    function getRoleClass(role) {
        if (role === 'student') return 'student';
        if (role === 'guest') return 'guest';
        return '';
    }

    /**
     * ✅ 生成头像HTML（优先用自定义头像URL，否则用首字母）
     */
    function getAvatarHtml(user, size) {
        size = size || 36;
        const initial = (user.username || '?').charAt(0).toUpperCase();
        const fontSize = Math.round(size * 0.4);
        if (user.avatar && user.avatar.trim() !== '') {
            return `<div class="msg-avatar" style="width:${size}px;height:${size}px;font-size:${fontSize}px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#007bff;color:#fff;flex-shrink:0;"><img src="${user.avatar}" alt="${user.username}" style="width:100%;height:100%;object-fit:cover;"></div>`;
        }
        return `<div class="msg-avatar" style="width:${size}px;height:${size}px;font-size:${fontSize}px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#007bff;color:#fff;flex-shrink:0;">${initial}</div>`;
    }

    /**
     * ✅ 更新在线用户列表
     */
    function updateUserList(users) {
        const container = document.getElementById('online-users-list');
        const countEl = document.getElementById('online-count');

        container.innerHTML = '';

        const onlineUsers = [];
        const offlineUsers = [];

        users.forEach((user) => {
            if (user.online) {
                onlineUsers.push(user);
            } else {
                offlineUsers.push(user);
            }
        });

        onlineUsers.sort((a, b) => a.id - b.id);
        offlineUsers.sort((a, b) => a.id - b.id);

        const sortedUsers = [...onlineUsers, ...offlineUsers];

        countEl.textContent = onlineUsers.length;

        if (sortedUsers.length === 0) {
            const noUserDiv = document.createElement('div');
            noUserDiv.className = 'no-users';
            noUserDiv.textContent = '暂无其他用户在线';
            container.appendChild(noUserDiv);
        } else {
            sortedUsers.forEach(user => {
                const a = document.createElement('a');
                a.className = 'online-user-item';
                a.href = "javascript:void(0)";

                const isMe = user.username === window.currentUsername;
                const dotColor = user.online ? '#66CD66' : '#cccccc';

                a.innerHTML = `
                    <span class="online-status-dot" style="background:${dotColor}"></span>
                    <span style="margin-left:6px;">${user.username}${isMe ? ' (我)' : ''}</span>
                `;

                a.onclick = () => openProfile(user);
                container.appendChild(a);
            });
        }
    }

    /**
     * ✅ 追加单条消息（带头像）
     */
    function appendMessage(data) {
        const div = document.createElement('div');
        const isSelf = data.username === window.currentUsername;
        const isDeveloper = data.username === 'hyc';

        div.className = 'message ' + (isSelf ? 'self' : 'other');

        // ✅ 开发者头衔
        let developerBadge = '';
        if (isDeveloper) {
            developerBadge = `<span class="developer-badge">开发者</span>`;
        }

        // ✅ 身份标签（在消息中显示）
        let roleBadge = '';
        if (data.role) {
            const roleLabel = getRoleLabel(data.role);
            const roleCls = getRoleClass(data.role);
            roleBadge = `<span class="role-badge ${roleCls}">${roleLabel}</span>`;
        }

        // ✅ 用户名行
        let senderHtml = '';
        if (!isSelf) {
            senderHtml = `
                <div class="sender-name">${roleBadge}${data.username}${developerBadge}</div>
            `;
        }

        // ✅ 气泡 + 时间（头像已彻底移除）
        div.innerHTML = `
            ${senderHtml}
            <div class="message-row">
                <div class="bubble">${data.content}</div>
            </div>
            <div class="time ${isSelf ? 'self-time' : 'other-time'}">${data.timestamp}</div>
        `;
        document.getElementById('messages').appendChild(div);
    }

    /**
     * ✅ 发送消息
     */
    function sendMsg() {
        const input = document.getElementById('msg_input');
        const content = input.value.trim();
        if (!content) return;

        socket.emit('send_message', { content });
        input.value = '';
    }

    const msgInput = document.getElementById('msg_input');
    msgInput.addEventListener('keydown', function(event) {
        if (event.keyCode === 13 && !event.shiftKey) {
            event.preventDefault();
            sendMsg();
        }
    });

    /**
     * ✅ 接收新消息（实时）
     */
    socket.on('new_message', function (data) {
        appendMessage(data);
        const box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
    });

    /**
     * ✅ 个人主页逻辑
     */
    let currentProfileUser = null;
    let isEditing = false;

    function openProfile(user) {
        currentProfileUser = user;
        isEditing = false;

        // 渲染头像（简介大头像 50px）
        const avatarContainer = document.getElementById('profile-avatar');
        avatarContainer.innerHTML = '';
        const profileAvatarHtml = getAvatarHtml(user, 50);
        // 替换 class 为 profile-avatar 的样式
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = profileAvatarHtml;
        const av = tempDiv.firstChild;
        av.className = '';
        av.style.width = '50px';
        av.style.height = '50px';
        av.style.fontSize = '1.4em';
        avatarContainer.appendChild(av);

        // 用户名 + 开发者头衔
        const isDeveloper = user.username === 'hyc';
        let developerBadge = '';
        if (isDeveloper) {
            developerBadge = `<span class="developer-badge">开发者</span>`;
        }
        document.getElementById('profile-username').innerHTML = user.username + developerBadge;

        // 在线状态
        const dotColor = user.online ? '#66CD66' : '#cccccc';
        const statusText = user.online ? '在线' : '离线';
        document.getElementById('profile-status-dot').style.background = dotColor;
        document.getElementById('profile-status-text').innerText = statusText;

        // ✅ 身份标签 + 真实姓名（共占一行）
        const roleBadge = document.getElementById('profile-role-badge');
        if (user.role) {
            const roleLabel = getRoleLabel(user.role);
            const roleCls = getRoleClass(user.role);
            roleBadge.className = 'role-badge ' + roleCls;
            roleBadge.textContent = roleLabel;
            roleBadge.style.display = 'inline-block';
        } else {
            roleBadge.style.display = 'none';
        }

        // 真实姓名
        const isMe = user.username === window.currentUsername;
        document.getElementById('profile-realname-input').value = user.realname || '';
        document.getElementById('profile-realname-display').innerText = user.realname || '未设置';

        document.getElementById('profile-bio-input').value = user.bio || '';
        document.getElementById('profile-bio-display').innerText = user.bio || '这个人很懒，什么都没写';

        updateProfileUIState(isMe, false);

        document.getElementById('profile-modal').classList.add('active');
    }

    function closeProfile() {
        document.getElementById('profile-modal').classList.remove('active');
        currentProfileUser = null;
    }

    function updateProfileUIState(isMe, editing) {
        const realnameInput = document.getElementById('profile-realname-input');
        const bioInput = document.getElementById('profile-bio-input');
        const realnameDisplay = document.getElementById('profile-realname-display');
        const bioDisplay = document.getElementById('profile-bio-display');
        const editBtn = document.getElementById('btn-edit');
        const saveBtn = document.getElementById('btn-save');

        if (!isMe) {
            realnameInput.style.display = 'none';
            bioInput.style.display = 'none';
            realnameDisplay.style.display = 'inline';
            bioDisplay.style.display = 'block';
            editBtn.style.display = 'none';
            saveBtn.style.display = 'none';
        } else {
            if (editing) {
                realnameInput.style.display = 'inline-block';
                bioInput.style.display = 'block';
                realnameDisplay.style.display = 'none';
                bioDisplay.style.display = 'none';
                editBtn.style.display = 'none';
                saveBtn.style.display = 'inline-block';
            } else {
                realnameInput.style.display = 'none';
                bioInput.style.display = 'none';
                realnameDisplay.style.display = 'inline';
                bioDisplay.style.display = 'block';
                editBtn.style.display = 'inline-block';
                saveBtn.style.display = 'none';
            }
        }
    }

    function toggleEdit() {
        isEditing = true;
        const isMe = currentProfileUser.username === window.currentUsername;
        updateProfileUIState(isMe, true);
    }

    function saveProfile() {
        const realname = document.getElementById('profile-realname-input').value.trim();
        const bio = document.getElementById('profile-bio-input').value.trim();

        if (!realname) {
            alert('真实姓名不能为空！');
            return;
        }

        fetch('/update_profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ realname: realname, bio: bio })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                currentProfileUser.realname = realname;
                currentProfileUser.bio = bio;

                document.getElementById('profile-realname-display').innerText = realname;
                document.getElementById('profile-bio-display').innerText = bio || '这个人很懒，什么都没写';

                isEditing = false;
                const isMe = currentProfileUser.username === window.currentUsername;
                updateProfileUIState(isMe, false);

                fetch('/online_users')
                    .then(res => res.json())
                    .then(data => {
                        updateUserList(data.users);
                    });

                alert('资料更新成功！');
            } else {
                alert('更新失败：' + data.message);
            }
        })
        .catch(err => {
            alert('网络错误，请重试');
            console.error(err);
        });
    }

    /**
     * ✅ 公告逻辑
     */
    document.addEventListener("DOMContentLoaded", function () {
        const ANNOUNCEMENT = {
            id: "2026-08-09-10-30",
            title: "更新公告",
            content: [
                "公告时间:2026-08-09",
                '<br>更新内容：',
                "&nbsp;&nbsp;&nbsp;&nbsp;1.注册新增真实姓名和身份选项（911/访客）🎉",
                "&nbsp;&nbsp;&nbsp;&nbsp;2.个人简介新增身份标签🏷️",
                "&nbsp;&nbsp;&nbsp;&nbsp;3.解决了一些提出bug的用户😡",
                "&nbsp;&nbsp;&nbsp;&nbsp;4.解决了网页太过流畅的bug😍",
                "&nbsp;&nbsp;&nbsp;&nbsp;5.新增了一些bug😅",
            ],
            duration: 4000
        };

        const storageKey = "announcement_read_" + ANNOUNCEMENT.id;
        const modal = document.getElementById("announcementModal");
        const titleEl = document.getElementById("announcementTitle");
        const contentEl = document.getElementById("announcementContent");
        const progressBtn = document.getElementById("progressBtn");
        const progressBar = document.getElementById("progressBar");
        const countdownText = document.getElementById("countdownText");
        const exitText = document.getElementById("exitText");

        if (localStorage.getItem(storageKey)) return;

        titleEl.textContent = ANNOUNCEMENT.title;
        contentEl.innerHTML = ANNOUNCEMENT.content.join('<br>');
        modal.classList.add("active");

        let elapsed = 0;
        const timer = setInterval(() => {
            elapsed += 100;
            const percent = (elapsed / ANNOUNCEMENT.duration) * 100;
            progressBar.style.width = `${percent}%`;

            const remaining = Math.ceil((ANNOUNCEMENT.duration - elapsed) / 1000);
            if (remaining > 0) {
                countdownText.textContent = `${remaining}秒后可退出`;
            }

            if (elapsed >= ANNOUNCEMENT.duration) {
                clearInterval(timer);
                countdownText.style.display = "none";
                exitText.style.display = "block";
                progressBar.style.width = "100%";
                progressBtn.style.cursor = "pointer";
                progressBtn.style.filter = "brightness(0.95)";
                progressBtn.onclick = closeAnnouncement;
            }
        }, 100);

        function closeAnnouncement() {
            modal.classList.remove("active");
            localStorage.setItem(storageKey, "1");
            clearInterval(timer);
        }
    });
</script>

</body>
</html>
