<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时聊天</title>

    <!-- ✅ Socket.IO 库 -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #e4e4e4;
        }

        /* ✅ 卡片容器 */
        .card-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            height: calc(100vh - 230px);
            background: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            box-sizing: border-box;
            border: 1px solid #333;
        }

        /* ✅ 侧边栏 */
        .sidebar {
            width: 240px;
            background: #181818;
            padding: 20px;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            flex-shrink: 1;
            min-width: 150px;
        }

        .sidebar-header {
            margin-bottom: 0px;
        }

        .sidebar h3 {
            color: #e4e4e4;
            margin-bottom: 6px;
            font-size: 17px;
        }

        .sidebar p {
            color: #66CD66;
            font-size: 12px;
        }

        .sidebar a {
            color: #999;
            text-decoration: none;
            font-size: 13px;
            margin-top: 10px;
            transition: color 0.2s;
        }

        .sidebar a:hover {
            color: #4f8cff;
        }

        /* ✅ 个人主页模态框样式 */
        .profile-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .profile-modal.active {
            display: flex;
        }

        .profile-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            width: 360px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            position: relative;
            border: 1px solid #333;
        }

        .profile-close-btn {
            position: absolute; top: 12px; right: 16px;
            background: none; border: none; font-size: 1.5em;
            cursor: pointer; color: #888;
        }

        .profile-close-btn:hover { color: #e4e4e4; }

        .profile-header {
            display: flex; align-items: center; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 1px solid #2a2a2a;
        }

        .profile-avatar {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #4f8cff;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4em; font-weight: bold;
            margin-right: 15px;
        }

        .profile-meta h3 { margin: 0 0 4px 0; font-size: 18px; color: #e4e4e4; }
        .profile-meta .status-text { font-size: 12px; display: flex; align-items: center; }
        .profile-meta .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

        .profile-field { margin-bottom: 18px; }
        .profile-label { font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        .profile-value {
            font-size: 14px; padding: 8px 0; color: #ccc;
            border-bottom: 1px solid #2a2a2a;
        }

        .profile-input {
            width: 100%; padding: 8px 10px; font-size: 14px;
            border: 1px solid #444; border-radius: 8px;
            outline: none; display: none;
            background: #2a2a2a; color: #e4e4e4;
        }

        .profile-input:focus { border-color: #4f8cff; }

        .profile-actions { margin-top: 20px; text-align: right; }

        .btn-edit, .btn-save {
            padding: 6px 16px; border: none; border-radius: 12px;
            cursor: pointer; font-size: 13px; margin-left: 8px;
        }

        .btn-edit { background: #333; color: #ccc; }
        .btn-edit:hover { background: #444; }

        .btn-save { background: #4f8cff; color: #fff; display: none; }
        .btn-save:hover { background: #3a6fd8; }

        .readonly-hint { font-size: 11px; color: #ff4d4f; margin-top: 4px; display: none; }

        /* ✅ 在线用户列表样式 */
        .online-users-section {
            flex: 1;
            margin-top: 20px;
            overflow-y: auto;
        }

        .online-users-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 4px;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        .online-user-item {
            display: flex;
            align-items: center;
            padding: 4px 0;
            font-size: 13px;
            color: #ccc;
        }

        .online-status-dot {
            width: 8px;
            height: 8px;
            background: #66CD66;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .current-user {
            font-weight: bold;
            color: #4f8cff;
        }

        .no-users {
            color: #666;
            font-size: 12px;
            padding: 10px 0;
        }

        /* ✅ 聊天区 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            min-width: 0;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #161616;
            position: relative;
        }

        /* ✅ 加载动画样式 */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            z-index: 10;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a2a;
            border-top: 3px solid #4f8cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .messages.loading {
            opacity: 0.7;
        }

        /* ✅ 消息容器 */
        .message {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }

        .message.self {
            align-items: flex-end;
        }

        .message.other {
            align-items: flex-start;
        }

        /* ✅ 发送者昵称 */
        .sender-name {
            font-size: 12px;
            color: #888;
            margin-bottom: 2px;
        }

        /* ✅ 开发者头衔样式 */
        .developer-badge {
            display: inline-block;
            background: linear-gradient(135deg, #8a2be2, #9370db);
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 8px;
            margin-left: 3px;
            vertical-align: middle;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
            box-shadow: 0 2px 4px rgba(138, 43, 226, 0.4);
            animation: badge-pulse 3s infinite;
        }

        @keyframes badge-pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; }
            100% { opacity: 0.9; }
        }

        .message.self .sender-name {
            display: none;
        }

        /* ✅ 气泡样式 */
        .bubble {
            max-width: 80%;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.3;
            word-break: break-word;
            text-align: left;
        }

        .self .bubble {
            background: #2b5a2b;
            color: #e4e4e4;
            border-bottom-right-radius: 4px;
        }

        .other .bubble {
            background: #2a2a2a;
            color: #e4e4e4;
            border: 1px solid #3a3a3a;
            border-bottom-left-radius: 4px;
        }

        /* ✅ 时间样式 */
        .time {
            font-size: 9px;
            color: #666;
            margin-top: 2px;
        }

        .self-time {
            text-align: right;
        }

        .other-time {
            text-align: left;
        }

        /* ✅ 输入区 */
        .input-area {
            display: flex;
            padding: 14px 20px;
            border-top: 1px solid #2a2a2a;
            background: #1e1e1e;
            gap: 10px;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid #444;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: #2a2a2a;
            color: #e4e4e4;
        }

        .input-area button {
            flex-shrink: 0;
            padding: 10px 20px;
            background: #4f8cff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            min-width: 60px;
        }

        .input-area input:focus {
            border-color: #4f8cff;
        }

        .input-area button:hover {
            background: #3a6fd8;
        }

        /* ✅ 滚动条美化（暗色） */
        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-track {
            background: #161616;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .online-users-section::-webkit-scrollbar {
            width: 4px;
        }

        .online-users-section::-webkit-scrollbar-track {
            background: #181818;
        }

        .online-users-section::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }

        /* ✅ 公告模态框暗色 */
        #announcementModal .profile-card {
            background: #1e1e1e;
            border: 1px solid #333;
        }

        #announcementTitle {
            color: #e4e4e4;
        }

        #announcementContent {
            color: #ccc;
        }

        #progressBtn {
            background: #2a2a2a !important;
            border: 1px solid #444;
        }

        #countdownText, #exitText {
            color: #ccc !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px;
                background: #121212;
            }

            .card-container {
                height: calc(100vh - 48px);
                border-radius: 16px;
                max-width: 100%;
                min-width: 0;
            }

            .sidebar {
                min-width: 120px;
                padding: 15px;
                width: auto;
            }

            .chat-area {
                min-width: 200px;
            }

            .input-area {
                padding: 10px 15px;
                gap: 8px;
            }

            .input-area input {
                padding: 8px 12px;
                font-size: 14px;
                min-width: 0;
            }

            .input-area button {
                padding: 8px 16px;
                font-size: 14px;
                flex-shrink: 0;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>

<!-- ✅ 卡片容器 -->
<div class="card-container">
    <!-- 左侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>{{ current_user.username }}</h3>
            <p>在线</p>
        </div>

        <!-- ✅ 在线用户列表 -->
        <div class="online-users-section">
            <div class="online-users-title">在线用户 (<span id="online-count">0</span>)</div>
            <div id="online-users-list">
                <div class="no-users">暂无其他用户在线</div>
            </div>
        </div>

        <a href="/logout">退出登录</a>
    </div>

    <!-- 右侧聊天区 -->
    <div class="chat-area">
        <div class="messages" id="messages">
            <!-- ✅ 加载提示 -->
            <div id="loading-indicator" class="loading-indicator">
                <div class="loading-spinner"></div>
                <span>正在加载消息...</span>
            </div>
        </div>

        <div class="input-area">
            <input id="msg_input" placeholder="输入消息..." autocomplete="off">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>
</div>

<!-- ✅ 个人主页模态框 -->
<div id="profile-modal" class="profile-modal">
    <div class="profile-card">
        <button class="profile-close-btn" onclick="closeProfile()">&times;</button>

        <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar">U</div>
            <div class="profile-meta">
                <h3 id="profile-username">用户名</h3>
                <div class="status-text">
                    <span class="status-dot" id="profile-status-dot" style="background:#66CD66"></span>
                    <span id="profile-status-text">在线</span>
                </div>
            </div>
        </div>

        <div class="profile-field">
            <div class="profile-label">真实姓名</div>
            <div class="profile-value" id="profile-realname-display"></div>
            <input type="text" class="profile-input" id="profile-realname-input" placeholder="请输入真实姓名">
        </div>

        <div class="profile-field">
            <div class="profile-label">个人简介</div>
            <div class="profile-value" id="profile-bio-display"></div>
            <textarea class="profile-input" id="profile-bio-input" rows="3" placeholder="请输入个人简介" style="resize: vertical;"></textarea>
        </div>

        <div class="profile-actions">
            <button class="btn-edit" id="btn-edit" onclick="toggleEdit()">编辑资料</button>
            <button class="btn-save" id="btn-save" onclick="saveProfile()">保存修改</button>
        </div>
    </div>
</div>

<div id="announcementModal" class="profile-modal" style="z-index: 1001;">
    <div class="profile-card">
        <h2 id="announcementTitle" style="margin-bottom: 0px; font-size: 18px;"></h2>
        <p id="announcementContent" style="line-height: 1.7; color: #ccc; margin-bottom: 12px;"></p>

        <div id="progressBtn" style="
            height: 26px;
            background: #2a2a2a;
            border-radius: 13px;
            overflow: hidden;
            position: relative;
            cursor: not-allowed;
            transition: all 0.3s ease;
            border: 1px solid #444;
        ">
            <div id="progressBar" style="
                width: 0%;
                height: 100%;
                background: linear-gradient(90deg, #1890ff, #69c0ff);
                border-radius: 13px;
                transition: width 0.1s linear;
            "></div>
            <span id="countdownText" style="
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 12px;
                color: #ccc;
                pointer-events: none;
            ">4秒后可退出</span>
            <span id="exitText" style="
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 13px;
                color: #ccc;
                font-weight: 500;
                pointer-events: none;
                display: none;
            ">退出公告</span>
        </div>
    </div>
</div>

<script>
    window.currentUsername = "{{ current_user.username }}";
    const socket = io();

    socket.on('connect', () => {
        console.log('✅ Socket 连接成功');

        const messagesContainer = document.getElementById('messages');
        const loadingIndicator = document.getElementById('loading-indicator');

        messagesContainer.classList.add('loading');

        fetch('/history')
            .then(res => res.json())
            .then(messages => {
                if (loadingIndicator) {
                    loadingIndicator.remove();
                }
                messagesContainer.classList.remove('loading');

                messages.forEach(appendMessage);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            })
            .catch(error => {
                console.error('加载历史消息失败:', error);
                if (loadingIndicator) {
                    loadingIndicator.innerHTML = '<div style="color:#ff4d4f;">加载失败，请刷新重试</div>';
                }
                messagesContainer.classList.remove('loading');
            });
    });

    socket.on('connect_error', (err) => {
        console.error('❌ Socket 连接失败:', err);
    });

    socket.on('user_list', function (data) {
        updateUserList(data.users || []);
    });

    function updateUserList(users) {
        const container = document.getElementById('online-users-list');
        const countEl = document.getElementById('online-count');

        container.innerHTML = '';

        const onlineUsers = [];
        const offlineUsers = [];

        users.forEach((user) => {
            if (user.online) {
                onlineUsers.push(user);
            } else {
                offlineUsers.push(user);
            }
        });

        onlineUsers.sort((a, b) => a.id - b.id);
        offlineUsers.sort((a, b) => a.id - b.id);

        const sortedUsers = [...onlineUsers, ...offlineUsers];

        countEl.textContent = onlineUsers.length;

        if (sortedUsers.length === 0) {
            const noUserDiv = document.createElement('div');
            noUserDiv.className = 'no-users';
            noUserDiv.textContent = '暂无其他用户在线';
            container.appendChild(noUserDiv);
        } else {
            sortedUsers.forEach(user => {
                const a = document.createElement('a');
                a.className = 'online-user-item';
                a.href = "javascript:void(0)";

                const isMe = user.username === window.currentUsername;
                const dotColor = user.online ? '#66CD66' : '#555';

                a.innerHTML = `
                    <span class="online-status-dot" style="background:${dotColor}"></span>
                    <span style="${isMe ? 'font-weight:bold;color:#4f8cff' : 'color:#ccc'}">
                        ${user.username}${isMe ? ' (我)' : ''}
                    </span>
                `;

                a.onclick = () => openProfile(user);
                container.appendChild(a);
            });
        }
    }

    function appendMessage(data) {
        const div = document.createElement('div');
        const isSelf = data.username === window.currentUsername;
        const isDeveloper = data.username === 'hyc';

        div.className = 'message ' + (isSelf ? 'self' : 'other');

        let senderHtml = '';
        if (!isSelf) {
            let developerBadge = '';
            if (isDeveloper) {
                developerBadge = `
                    <span class="developer-badge">开发者</span>
                `;
            }

            senderHtml = `
                <div class="sender-name">
                    ${data.username}${developerBadge}
                </div>
            `;
        }

        div.innerHTML = `
            ${senderHtml}
            <div class="bubble">${data.content}</div>
            <div class="time ${isSelf ? 'self-time' : 'other-time'}">${data.timestamp}</div>
        `;
        document.getElementById('messages').appendChild(div);
    }

    function sendMsg() {
        const input = document.getElementById('msg_input');
        const content = input.value.trim();
        if (!content) return;

        socket.emit('send_message', { content });
        input.value = '';
    }

    const msgInput = document.getElementById('msg_input');
    msgInput.addEventListener('keydown', function(event) {
        if (event.keyCode === 13 && !event.shiftKey) {
            event.preventDefault();
            sendMsg();
        }
    });

    socket.on('new_message', function (data) {
        appendMessage(data);
        const box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
    });

    let currentProfileUser = null;
    let isEditing = false;

    function openProfile(user) {
        currentProfileUser = user;
        isEditing = false;

        document.getElementById('profile-avatar').innerText = user.username.charAt(0).toUpperCase();

        const isDeveloper = user.username === 'hyc';
        let developerBadge = '';
        if (isDeveloper) {
            developerBadge = `<span class="developer-badge">开发者</span>`;
        }
        document.getElementById('profile-username').innerHTML = user.username + developerBadge;

        const dotColor = user.online ? '#66CD66' : '#555';
        const statusText = user.online ? '在线' : '离线';
        document.getElementById('profile-status-dot').style.background = dotColor;
        document.getElementById('profile-status-text').innerText = statusText;

        const isMe = user.username === window.currentUsername;

        document.getElementById('profile-realname-input').value = user.realname || '';
        document.getElementById('profile-realname-display').innerText = user.realname || '未设置';

        document.getElementById('profile-bio-input').value = user.bio || '';
        document.getElementById('profile-bio-display').innerText = user.bio || '这个人很懒，什么都没写';

        updateProfileUIState(isMe, false);
        document.getElementById('profile-modal').classList.add('active');
    }

    function closeProfile() {
        document.getElementById('profile-modal').classList.remove('active');
        currentProfileUser = null;
    }

    function updateProfileUIState(isMe, editing) {
        const realnameInput = document.getElementById('profile-realname-input');
        const bioInput = document.getElementById('profile-bio-input');
        const realnameDisplay = document.getElementById('profile-realname-display');
        const bioDisplay = document.getElementById('profile-bio-display');
        const editBtn = document.getElementById('btn-edit');
        const saveBtn = document.getElementById('btn-save');

        if (!isMe) {
            realnameInput.style.display = 'none';
            bioInput.style.display = 'none';
            realnameDisplay.style.display = 'block';
            bioDisplay.style.display = 'block';
            editBtn.style.display = 'none';
            saveBtn.style.display = 'none';
        } else {
            if (editing) {
                realnameInput.style.display = 'block';
                bioInput.style.display = 'block';
                realnameDisplay.style.display = 'none';
                bioDisplay.style.display = 'none';
                editBtn.style.display = 'none';
                saveBtn.style.display = 'inline-block';
            } else {
                realnameInput.style.display = 'none';
                bioInput.style.display = 'none';
                realnameDisplay.style.display = 'block';
                bioDisplay.style.display = 'block';
                editBtn.style.display = 'inline-block';
                saveBtn.style.display = 'none';
            }
        }
    }

    function toggleEdit() {
        isEditing = true;
        const isMe = currentProfileUser.username === window.currentUsername;
        updateProfileUIState(isMe, true);
    }

    function saveProfile() {
        const realname = document.getElementById('profile-realname-input').value.trim();
        const bio = document.getElementById('profile-bio-input').value.trim();

        if (!realname) {
            alert('真实姓名不能为空！');
            return;
        }

        fetch('/update_profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ realname: realname, bio: bio })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                currentProfileUser.realname = realname;
                currentProfileUser.bio = bio;

                document.getElementById('profile-realname-display').innerText = realname;
                document.getElementById('profile-bio-display').innerText = bio || '这个人很懒，什么都没写';

                isEditing = false;
                const isMe = currentProfileUser.username === window.currentUsername;
                updateProfileUIState(isMe, false);

                fetch('/online_users')
                    .then(res => res.json())
                    .then(data => {
                        updateUserList(data.users);
                    });

                alert('资料更新成功！');
            } else {
                alert('更新失败：' + data.message);
            }
        })
        .catch(err => {
            alert('网络错误，请重试');
            console.error(err);
        });
    }
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const ANNOUNCEMENT = {
        id: "2026-07-07-07-07",
        title: "更新公告",
        content: [
            "公告时间:2026-07-07 7:07",
            '<span style="color: #ccc; font-weight: 500;">更新内容：</span>',
            "&nbsp;&nbsp;&nbsp;&nbsp;1.新增个人主页的功能，可通过点击侧边栏的用户列表中的用户来查看🥰",
            "&nbsp;&nbsp;&nbsp;&nbsp;2.新增公告功能😍",
            "&nbsp;&nbsp;&nbsp;&nbsp;3.修复了排序不工作的问题🤔",
            '<span style="color: #ccc; font-weight: 500;">更新要求：</span>',
            "&nbsp;&nbsp;&nbsp;&nbsp;1.务必填写您的个人主页，尤其是真实姓名(可用拼音首字母代替)😡",
            "&nbsp;&nbsp;&nbsp;&nbsp;2.我好无聊😭",
        ],
        duration: 6000
    };

    const storageKey = "announcement_read_" + ANNOUNCEMENT.id;
    const modal = document.getElementById("announcementModal");
    const titleEl = document.getElementById("announcementTitle");
    const contentEl = document.getElementById("announcementContent");
    const progressBtn = document.getElementById("progressBtn");
    const progressBar = document.getElementById("progressBar");
    const countdownText = document.getElementById("countdownText");
    const exitText = document.getElementById("exitText");

    if (localStorage.getItem(storageKey)) return;

    titleEl.textContent = ANNOUNCEMENT.title;
    contentEl.innerHTML = ANNOUNCEMENT.content.join('<br>');
    modal.classList.add("active");

    let elapsed = 0;
    const timer = setInterval(() => {
        elapsed += 100;
        const percent = (elapsed / ANNOUNCEMENT.duration) * 100;
        progressBar.style.width = `${percent}%`;

        const remaining = Math.ceil((ANNOUNCEMENT.duration - elapsed) / 1000);
        if (remaining > 0) {
            countdownText.textContent = `${remaining}秒后可退出`;
        }

        if (elapsed >= ANNOUNCEMENT.duration) {
            clearInterval(timer);
            countdownText.style.display = "none";
            exitText.style.display = "block";
            progressBar.style.width = "100%";
            progressBtn.style.cursor = "pointer";
            progressBtn.style.filter = "brightness(0.95)";
            progressBtn.onclick = closeAnnouncement;
        }
    }, 100);

    function closeAnnouncement() {
        modal.classList.remove("active");
        localStorage.setItem(storageKey, "1");
        clearInterval(timer);
    }
});
</script>
